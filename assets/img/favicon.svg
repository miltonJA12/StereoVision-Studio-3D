
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">

      <stop offset="0%" stop-color="#2563eb"></stop>
      <stop offset="100%" stop-color="#7453d8"></stop>

    </linearGradient>
  </defs>

  <!-- Fondo del logotipo -->
  <rect width="64" height="64" rx="16" fill="url(#background)"></rect>

  <!-- Perspectiva izquierda -->
  <circle cx="25" cy="32" r="15" fill="none" stroke="#ff6679" stroke-width="4.5"></circle>

  <!-- Perspectiva derecha -->
  <circle cx="39" cy="32" r="15" fill="none" stroke="#53edff" stroke-width="4.5"></circle>

  <!-- Fusión binocular -->
  <circle cx="32" cy="32" r="5" fill="#ffffff"></circle>

  <circle cx="32" cy="32" r="2" fill="#0b1020"></circle>

</svg>
